name: Prepare native release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install release environment tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap debian-archive-keyring
      - name: Build and audit native bundle
        run: sudo bash tool/build_release_environment.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sky-ui-linux-${{ matrix.arch }}
          path: build/releases/v*/*
          if-no-files-found: error
          retention-days: 7
